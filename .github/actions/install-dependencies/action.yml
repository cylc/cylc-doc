name: Install dependencies
description: Install dependencies and setup + activate conda env

inputs:
  python-version:
    required: false
  apt:
    required: false
    description: 'Whether to install apt dependencies'
    default: 'true'

runs:
  using: composite
  steps:
    # Explanation of these dependencies:
    # - https://github.com/ImageMagick/ImageMagick/issues/374#issuecomment-279252866
    - shell: bash
      if: ${{ inputs.apt == 'true' }}
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          librsvg2-bin \
          ghostscript \
          pkg-config \
          libgraphviz-dev \
          gsfonts \
          libfreetype6-dev \
          libfontconfig1-dev

    - uses: mamba-org/setup-micromamba@v3
      with:
        cache-environment: true
        post-cleanup: 'all'
        environment-name: cylc-test
        create-args: >-
          python=${{ inputs.python-version || '3' }}
          graphviz
          enchant
          hunspell-en
